description: >-
  Ford publishes no plans and no prices for its APIs. The Ford Developer Marketplace at
  developer.ford.com has no pricing route at all — there is no /pricing, /plans or /plan page in
  the application's route table, and no price appears anywhere in the portal's own content bundle.
  Access to FordConnect is obtained by registering an application in the developer account,
  selecting data categories and being issued credentials; commercial terms, where they exist, are
  set in a partner agreement that is not public. The Ford Developer Programme Terms and Conditions
  reserve the right to start charging for access without notice ("Ford reserves the right to charge
  a fee for access and use of the Materials without advance notice to You", section 13.1), which
  confirms that no published price schedule exists today.
notes: >-
  Replaces a 2026-05-04 bulk-sweep scaffold that asserted a named "Developer / Sandbox" freemium
  tier at $0.00. That tier is not published by Ford and was not verifiable; it has been removed
  rather than carried forward. An honest zero is the measurement.
