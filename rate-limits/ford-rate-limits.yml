description: >-
  Ford publishes no numeric rate limits for its APIs, and no rate-limit response headers were
  observed. Nothing in the Ford Developer Marketplace's own content bundle states a request-per-
  second, per-minute or per-day figure, a burst allowance, a quota, or a minimum polling interval.
  An unauthenticated call to a live FordConnect endpoint returned a bare 401 carrying no
  X-RateLimit-*, RateLimit-* or Retry-After header, so we have no runtime signal to record either.
notes: >-
  Replaces a 2026-05-04 bulk-sweep scaffold that asserted a per-partner throttle and a per-vehicle
  "minimum poll interval enforced to protect TCU/modem". Those rows described what a connected-
  vehicle API typically does, not what Ford publishes; neither was verifiable and both have been
  removed. limit_count: 0 is the honest measurement.
