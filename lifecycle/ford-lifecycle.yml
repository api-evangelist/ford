headline_finding: >-
  api.mps.ford.com — the production host declared in every servers[] block in this repository, and
  the base URL Ford's own FordConnect documentation has historically used — returned HTTP 503
  "no healthy upstream" from Apigee (x-glb-version: v2.0, x-from: apigee-na) on every path probed,
  on three separate attempts on 2026-09-10. A different host, api.vehicle.ford.com, is live and
  answers 401 to unauthenticated calls on real FordConnect v3 paths; that host is named in Ford's
  own account-linking bundle at fordconnect.cv.ford.com. Read together with the 404 on
  developer.ford.com/apis/fordconnect, the FordConnect surface this repository describes appears to
  have moved or been retired at the documented address. This is a probe result, not a Ford
  announcement — Ford publishes no deprecation notice, changelog or status page we could find.
