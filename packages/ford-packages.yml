summary:
  official_count: 0
  community_count: 6
  finding: >-
    Ford publishes no first-party client library for FordConnect on any public package registry.
    Neither github.com/Ford (6 public repositories — autonomous-vehicle datasets, a Git fork and a
    Hoppscotch fork) nor github.com/FordLabs (8 public repositories, mostly deprecated internal
    tooling) contains an API SDK. Every package below is community-authored and reverse-engineered
    against Ford's partner API; none is first-party and none should be read as Ford-supported.
    Two of the six have not shipped a release in over two years, and the newest, iobroker.ford,
    tracks the FordPass mobile API rather than the FordConnect partner API.
