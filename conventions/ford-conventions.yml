async_command_pattern:
  present: true
  confidence: low
  description: >-
    Vehicle commands are issued asynchronously — the write returns a command identifier and the
    caller polls a per-command status resource until it resolves.
  note: >-
    confidence low: this pattern is described in the API Evangelist best-effort OpenAPI in
    openapi/, which was written from Ford's public developer page rather than published by Ford.
    It is recorded because it materially changes how an agent must call this API, and flagged
