aid: ford
name: Ford
description: 'Ford Motor Company is a multinational automotive manufacturer that designs, builds and sells
  cars, trucks, SUVs and commercial vehicles, and operates a partner-facing API program through the Ford
  Developer Marketplace at developer.ford.com. The flagship surface is FordConnect, which lets an approved
  application read connected-vehicle data and issue vehicle commands to enrolled Ford and Lincoln vehicles,
  with the vehicle owner''s consent captured as fourteen named data categories in the FordPass account-linking
  flow. Ford also publishes a WLTP emissions lookup for authorized parties. Access is partner-gated rather
  than self-serve: applications are registered in a Ford developer account and issued a client id plus
  two rotating secrets. Ford publishes no OpenAPI, pricing, rate limits, changelog or status page on any
  surface reachable without signing in.'
