note: 'Ford does not publish a conventional OAuth scope string list. Authorization on FordConnect is granted
  as DATA CATEGORIES: an application declares the categories it needs on the ''API & Scope Info'' step
  of credential creation (''Data categories in scope'', ''At least one Data Category must be selected''),
  and the vehicle owner consents to those categories in the FordPass account-linking flow. The categories
  below are Ford''s own, harvested verbatim from the developer portal. The OIDC layer itself advertises
  only the ''openid'' scope — confirmed from Ford''s own Azure AD B2C discovery document — so the category
  list, not an OAuth scope string, is the real permission surface. The single ''access'' scope previously
  recorded here was derived from an API Evangelist documentation-derived OpenAPI, not from Ford.'
